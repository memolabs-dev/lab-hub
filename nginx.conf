# lab.memolabs.dev : site statique multi-locale (/fr/, /en/).
# Inclus par nginx via /etc/nginx/conf.d/*.conf, donc en contexte http.

# locale par défaut = fr, sauf si le navigateur demande l'anglais en premier
map $http_accept_language $lab_locale {
    default   fr;
    ~*^\s*en  en;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # derrière Traefik nginx ne voit que du http : sans ça les 30x renvoient
    # un Location en http:// et coûtent un aller-retour de plus au navigateur
    absolute_redirect off;

    # racine : négociation de langue, jamais de contenu servi directement
    location = / {
        return 302 /$lab_locale/;
    }

    # /fr et /en sans slash final
    location = /fr { return 301 /fr/; }
    location = /en { return 301 /en/; }

    # les pages HTML pointent vers les assets hashés : sans en-tête, le navigateur
    # les garde en cache par heuristique et sert l'ancienne navbar après un déploiement
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # les assets buildés sont hashés
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # projects.json est régénéré à chaque build, il ne doit pas coller en cache
    location = /projects.json {
        add_header Cache-Control "no-cache";
    }
}
