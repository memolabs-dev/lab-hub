name: verify public lab hub
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Ensure private console is absent from build
        run: test ! -e dist/console && test ! -e dist/api && test ! -e console
